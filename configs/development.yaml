# Development: small corpus, chatty logs, relaxed rate limits.
# Overrides configs/default.yaml (which is layered underneath automatically).

environment: development
log_level: INFO
log_format: console
corpus_size: small

data:
  min_text_length: 50

embedding:
  batch_size: 32

faiss:
  # Exact search keeps the dev experience deterministic; ANN variants are
  # exercised by scripts/benchmark.py and the integration tests.
  index_type: flat_ip

bm25:
  use_stemming: true

api:
  rate_limit_per_minute: 600
  rate_limit_enabled: true
  cache_size: 128
  cache_ttl_seconds: 60
  expose_stack_traces: true
  log_queries: true
  docs_url: /docs
  redoc_url: /redoc
